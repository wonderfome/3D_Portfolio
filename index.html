<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOME 3D Viewer</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f26; --line:#2c313c; --txt:#e6e9ef; --dim:#8b93a3; --acc:#5ac8fa; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:14px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }

  #view { flex:1; position:relative; min-width:0; }
  #view canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:14px; top:14px; pointer-events:none;
    background:rgba(20,22,26,.78); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; font-size:12px; color:var(--dim); white-space:pre; backdrop-filter:blur(6px); }
  #sel { color:var(--acc); }

  #bar { position:absolute; left:0; right:0; top:0; height:3px; background:transparent; }
  #bar > i { display:block; height:100%; width:0%; background:var(--acc); transition:width .12s; }

  #side { width:290px; flex:0 0 290px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; }
  #side h1 { font-size:15px; margin:0; padding:14px 16px 4px; letter-spacing:.3px; }
  #side .sub { padding:0 16px 12px; color:var(--dim); font-size:12px; border-bottom:1px solid var(--line); }
  #tools { display:flex; gap:6px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
  button, .filebtn { background:#262b34; color:var(--txt); border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover, .filebtn:hover { background:#303643; border-color:#3d4553; }
  #list { flex:1; overflow-y:auto; padding:8px; }
  .row { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .row:hover { background:#252a33; }
  .row.on { background:#253444; outline:1px solid #34506b; }
  .row .nm { flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .tri { color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .row input { accent-color:var(--acc); cursor:pointer; }
  .row.err .nm { color:#e06c75; }
  #foot { border-top:1px solid var(--line); padding:10px 16px; color:var(--dim); font-size:11.5px; }
  ::-webkit-scrollbar { width:9px } ::-webkit-scrollbar-thumb { background:#333a46; border-radius:9px }

  
  #cvwrap { position:absolute; inset:0; display:none; z-index:20; pointer-events:none; }
  #cvwrap.on { display:block; }
  #cvpop { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(880px, 82vw); height:82vh; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 24px 70px rgba(0,0,0,.62); overflow:hidden; pointer-events:auto; }
  #cvhead { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px 8px 14px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--dim); }
  #cvhead button { padding:2px 9px; line-height:1.4; }
  #cvframe { flex:1; width:100%; border:0; background:#fff; }
  #cvfoot { padding:7px 12px; border-top:1px solid var(--line); font-size:11.5px; }
  #cvfoot a { color:var(--acc); text-decoration:none; }
  #cvfoot a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="bar"><i></i></div>
    <div id="hud"></div>
    <div id="cvwrap">
      <div id="cvpop">
        <div id="cvhead"><span>CV — Fome</span><button id="cvx" title="ปิด">✕</button></div>
        <iframe id="cvframe" title="CV"></iframe>
        <div id="cvfoot"><a id="cvfull" href="https://wonderfome.github.io/CV_Fome/" target="_blank" rel="noopener">เปิดเต็มแท็บ ↗</a></div>
      </div>
    </div>
    <div id="side">
      <h1>FOME 3D Viewer</h1>
      <div class="sub" id="sub">กำลังโหลด…</div>
      <div id="tools">
        <button id="frame">ทั้งฉาก</button>
        <button id="wire">Wireframe</button>
        <button id="on">แสดงทั้งหมด</button>
        <button id="off">ซ่อนทั้งหมด</button>
        <label class="filebtn">เพิ่มไฟล์<input id="add" type="file" accept=".glb,.gltf" multiple hidden></label>
      </div>
      <div id="list"></div>
      <div id="foot">ลากเมาส์ซ้าย = หมุน · ขวา/กลิ้ง = พาน · คลิกชื่อ = โฟกัส · คลิกในฉาก = เลือก</div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const FILES = [
  'Cube','Cube.001','Cube.002','Cube.003','Cube.004','Cube.005','Cube.006','Cube.007',
  'Cube.008','Cube.009','Cube.010','Cube.011','Cube.012','Cube.013','Cube.016','Cube.017',
  'Cube.018','Cube.021','Cube.022','Cube.024',
  'Cylinder','Cylinder.001','Cylinder.002','Cylinder.003','Cylinder.005',
  'Icosphere','Icosphere.001','Icosphere.002','Icosphere.003','Icosphere.004','Icosphere.005','Icosphere.006',
  'Text','Text.001','Text.002','Text.003','Text.004','Text.005','Text.006'
];


const TEXTURES = { 'Cube.024': 'dd.jpg' };


const PLANAR_FIT = { 'Cube.024': { face: '+X' } };


const PHOTO_VIEW = { lookAt: 'Cube.024', fallback: [0.76, 0.96, -0.07],
                     dir: [1, 0.12, 0], dist: 2.5 };
const CAM_VIEWS = {
  'Cube.021': PHOTO_VIEW,     
  'Cube.022': PHOTO_VIEW,     
  'Text.005': PHOTO_VIEW      
};


const LINK_URLS = { 'Text.006': 'https://wonderfome.github.io/CV_Fome/' };


const cvWrap = document.getElementById('cvwrap');
const cvFrame = document.getElementById('cvframe');
const cvFull = document.getElementById('cvfull');

function openCvPop(url) {
  cvFull.href = url;
  if (cvFrame.getAttribute('src') !== url) cvFrame.setAttribute('src', url);
  cvWrap.classList.add('on');
}
function closeCvPop() {
  cvWrap.classList.remove('on');
  cvFrame.setAttribute('src', 'about:blank');      
}
document.getElementById('cvx').addEventListener('click', closeCvPop);

const SWAY = { match: /^Icosphere/, ampRatio: 0.15, speed: 1.1 };


const LEAF_FX = { key: 'leafFx', match: /^Icosphere/,
  bot: new THREE.Color(0x1d5c2e), top: new THREE.Color(0x7ddf8a),
  rim: new THREE.Color(0xbfffca), rimPow: 2.2, rimAmt: 0.55 };

const HOUSE_FX = { key: 'houseFx', match: /^Cube$/,
  bot: new THREE.Color(0x14532d), top: new THREE.Color(0x4ade80),
  rim: new THREE.Color(0xbbf7d0), rimPow: 2.2, rimAmt: 0.45 };
const uLeafTime = { value: 0 };


function injectGradientFx(rec, obj, cfg) {
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const hMin = box.min.y, hMax = box.max.y;
  obj.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(mt => {
      if (!mt || !mt.isMeshStandardMaterial || mt.userData.gradFx) return;
      mt.userData.gradFx = true;
      mt.onBeforeCompile = (sh) => {
        sh.uniforms.uLeafTime = uLeafTime;
        sh.uniforms.uLeafBot = { value: cfg.bot };
        sh.uniforms.uLeafTop = { value: cfg.top };
        sh.uniforms.uLeafRim = { value: cfg.rim };
        sh.uniforms.uHMin = { value: hMin };
        sh.uniforms.uHMax = { value: hMax };
        sh.vertexShader = sh.vertexShader
          .replace('#include <common>',
            '#include <common>\nvarying float vLeafH;\nvarying vec3 vLeafN;\nvarying vec3 vLeafV;')
          .replace('#include <fog_vertex>',
            '#include <fog_vertex>\nvLeafH = (modelMatrix * vec4(transformed, 1.0)).y;\n' +
            'vLeafN = normalize(mat3(modelMatrix) * objectNormal);\n' +
            'vLeafV = normalize(cameraPosition - (modelMatrix * vec4(transformed, 1.0)).xyz);');
        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>',
            '#include <common>\nuniform float uLeafTime;\nuniform vec3 uLeafBot;\nuniform vec3 uLeafTop;\n' +
            'uniform vec3 uLeafRim;\nuniform float uHMin;\nuniform float uHMax;\n' +
            'varying float vLeafH;\nvarying vec3 vLeafN;\nvarying vec3 vLeafV;')
          .replace('#include <color_fragment>',
            '#include <color_fragment>\n' +
            'float leafK = smoothstep(0.0, 1.0, clamp((vLeafH - uHMin) / max(uHMax - uHMin, 1e-4), 0.0, 1.0));\n' +
            'diffuseColor.rgb = mix(uLeafBot, uLeafTop, leafK);\n' +
            'float leafRim = pow(1.0 - abs(dot(normalize(vLeafN), normalize(vLeafV))), ' +
            cfg.rimPow.toFixed(2) + ') * ' + cfg.rimAmt.toFixed(2) + ';\n' +
            'diffuseColor.rgb += uLeafRim * leafRim * (0.85 + 0.15 * sin(uLeafTime * 1.4));');
      };
      mt.customProgramCacheKey = () => cfg.key;
      mt.needsUpdate = true;
    });
  });
}

const view = document.getElementById('view');
const listEl = document.getElementById('list');
const hudEl = document.getElementById('hud');
const subEl = document.getElementById('sub');
const barEl = document.querySelector('#bar > i');


const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 5000);
camera.position.set(3, 2.2, 4.2);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
view.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;


let camAnim = null;                          
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;


function flyTo(pos, tgt) {
  const travel = camera.position.distanceTo(pos) + controls.target.distanceTo(tgt);
  const dur = Math.min(1.5, Math.max(0.5, travel / 6));
  camAnim = { t0: performance.now(), dur: dur * 1000,
              fromPos: camera.position.clone(), toPos: pos.clone(),
              fromTgt: controls.target.clone(), toTgt: tgt.clone() };
}
const stopFly = () => { camAnim = null; };

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2622, 1.2));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.0);
sun.position.set(4, 7, 5);
scene.add(sun);

const root = new THREE.Group();
scene.add(root);

const boxHelper = new THREE.Box3Helper(new THREE.Box3(), 0x5ac8fa);
boxHelper.visible = false;
scene.add(boxHelper);


const models = [];
let selected = null;
let wireframe = false;
let progress = { done:0, total:FILES.length };


const loader = new GLTFLoader();

function addEntry(name, src) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<input type="checkbox" checked><span class="nm"></span><span class="tri"></span>`;
  row.querySelector('.nm').textContent = name;
  row.title = name;
  listEl.appendChild(row);

  const rec = { name, src, row, obj:null, tris:0, ok:false };
  models.push(rec);

  row.addEventListener('click', (e) => {
    if (e.target.tagName === 'INPUT') return;
    select(rec);
  });
  row.querySelector('input').addEventListener('change', (e) => {
    if (rec.obj) rec.obj.visible = e.target.checked;
    if (selected === rec && !e.target.checked) select(null);
  });
  return rec;
}

function select(rec) {
  closeCvPop();                                    // เลือกอย่างอื่น = ปิดป๊อปอัพเว็บ
  models.forEach(m => m.row.classList.toggle('on', m === rec));
  selected = rec && rec.ok ? rec : null;
  if (selected) {
    const b = new THREE.Box3().setFromObject(selected.obj);
    boxHelper.box.copy(b);
    boxHelper.visible = b.isEmpty() === false;
    const camView = CAM_VIEWS[selected.name];
    if (camView) applyCamView(camView); else frame(b, 0.35);
  } else {
    boxHelper.visible = false;
  }
}


const texLoader = new THREE.TextureLoader();

const FRONT_SLOT = 1;                       


function fitFrontFace(rec, face) {
  if (!/^[+-][XYZ]$/.test(face)) return;
  const axis = 'XYZ'.indexOf(face[1]);
  const sign = face[0] === '-' ? -1 : 1;
  const faceN = new THREE.Vector3();
  faceN.setComponent(axis, sign);

  
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), faceN);
  if (right.lengthSq() < 1e-6) right.set(1, 0, 0);           // หน้า +Y/-Y ใช้แกน X แทน
  right.normalize();
  const upFace = new THREE.Vector3().crossVectors(faceN, right).normalize();

  rec.obj.traverse(o => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position;
    const index = o.geometry.index;
    if (!pos || !index) return;

   
    const pa = new THREE.Vector3(), pb = new THREE.Vector3(), pc = new THREE.Vector3();
    const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), gn = new THREE.Vector3();
    const front = [], rest = [];
    for (let t = 0; t < index.count; t += 3) {
      pa.fromBufferAttribute(pos, index.getX(t));
      pb.fromBufferAttribute(pos, index.getX(t + 1));
      pc.fromBufferAttribute(pos, index.getX(t + 2));
      gn.crossVectors(e1.subVectors(pb, pa), e2.subVectors(pc, pa));
      if (gn.lengthSq() < 1e-20) { rest.push(index.getX(t), index.getX(t + 1), index.getX(t + 2)); continue; }
      gn.normalize();
      if (sign * gn.getComponent(axis) > 0.5)
        front.push({ i: [index.getX(t), index.getX(t + 1), index.getX(t + 2)],
                     c: (pa.x + pb.x + pc.x) / 3 });
      else
        rest.push(index.getX(t), index.getX(t + 1), index.getX(t + 2));
    }
    if (front.length < 1) return;

    
    let maxC = -Infinity, minC = Infinity;
    for (const f of front) { maxC = Math.max(maxC, f.c); minC = Math.min(minC, f.c); }
    const eps = Math.max(1e-4, (maxC - minC) * 0.01);
    const inner = front.filter(f => f.c <= maxC - eps);
    const faceIdx = (inner.length ? inner : front).map(f => f.i).flat();
    const bezelIdx = inner.length ? front.filter(f => f.c > maxC - eps).map(f => f.i).flat() : [];

    
    const p = new THREE.Vector3();
    const bb = { uMin: Infinity, uMax: -Infinity, vMin: Infinity, vMax: -Infinity };
    for (let i = 0; i < faceIdx.length; i++) {
      p.fromBufferAttribute(pos, faceIdx[i]);
      const du = p.dot(right), dv = p.dot(upFace);
      bb.uMin = Math.min(bb.uMin, du); bb.uMax = Math.max(bb.uMax, du);
      bb.vMin = Math.min(bb.vMin, dv); bb.vMax = Math.max(bb.vMax, dv);
    }
    const du = bb.uMax - bb.uMin || 1, dv = bb.vMax - bb.vMin || 1;

  
    const uv = new Float32Array(pos.count * 2);
    for (let i = 0; i < faceIdx.length; i++) {
      const vi = faceIdx[i];
      p.fromBufferAttribute(pos, vi);
      uv[vi * 2]     = (p.dot(right) - bb.uMin) / du;
      uv[vi * 2 + 1] = (bb.vMax - p.dot(upFace)) / dv;
    }
    o.geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

    
    const tail = bezelIdx.concat(rest);
    o.geometry.setIndex(faceIdx.concat(tail));
    o.geometry.clearGroups();
    o.geometry.addGroup(0, faceIdx.length, FRONT_SLOT);
    if (tail.length) o.geometry.addGroup(faceIdx.length, tail.length, 0);

    
    const base = Array.isArray(o.material) ? o.material[0] : o.material;
    o.material = [base, base.clone()];
  });
}

function applyTexture(rec, url) {
  const fit = PLANAR_FIT[rec.name];
  if (fit) fitFrontFace(rec, fit.face);

  texLoader.load(url, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;             
    tex.flipY = false;                                  
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    rec.obj.traverse(o => {
      if (!o.isMesh) return;
      const m = Array.isArray(o.material) ? o.material[FRONT_SLOT] : null;
      if (!m) return;
      m.map = tex;
      m.color.set(0xffffff);
      m.metalness = 0;
      m.roughness = 1;
      m.envMapIntensity = 0.6;
      m.needsUpdate = true;
    });
  }, undefined, () => console.error('texture', url, 'โหลดไม่สำเร็จ'));
}

function onLoad(rec, gltf) {
  const obj = gltf.scene;
  obj.name = rec.name;
  obj.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = false; o.frustumCulled = true; } });
  root.add(obj);
  rec.obj = obj;
  rec.ok = true;
  if (SWAY.match.test(rec.name)) {                  
    const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
    rec.sway = { bx: obj.position.x, amp: size.x * SWAY.ampRatio,
                 phase: models.length * 2.39, rate: 0.9 + (models.length % 5) * 0.05 };
  }
  if (LEAF_FX.match.test(rec.name)) injectGradientFx(rec, obj, LEAF_FX);    
  if (HOUSE_FX.match.test(rec.name)) injectGradientFx(rec, obj, HOUSE_FX);  

  let tris = 0;
  obj.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry;
    const n = g.index ? g.index.count : (g.attributes.position ? g.attributes.position.count : 0);
    tris += Math.floor(n / 3);
    if (wireframe) { const m = Array.isArray(o.material) ? o.material : [o.material];
      m.forEach(x => x && (x.wireframe = true)); }
  });
  rec.tris = tris;
  rec.row.querySelector('.tri').textContent = tris.toLocaleString();

  if (TEXTURES[rec.name]) applyTexture(rec, TEXTURES[rec.name]);
}

function onErr(rec) {
  rec.row.classList.add('err');
  rec.row.querySelector('.tri').textContent = '✕';
  rec.row.querySelector('input').checked = false;
}

async function loadAll() {
  for (const name of FILES) {
    const rec = addEntry(name, `3D/${name}.glb`);
    try {
      const gltf = await loader.loadAsync(rec.src);
      onLoad(rec, gltf);
    } catch (err) {
      console.error(name, err);
      onErr(rec);
    }
    progress.done++;
    barEl.style.width = (progress.done / progress.total * 100) + '%';
  }
  barEl.style.width = '0%';
  const ok = models.filter(m => m.ok).length;
  subEl.textContent = `โหลด ${ok}/${models.length} โมเดล · คลิกชื่อเพื่อโฟกัส`;
  frame();
}


function frame(box = new THREE.Box3().setFromObject(root), pad = 0.15) {
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3()).length() || 1;
  const d = (s / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * (1 + pad);
  const dir = camera.position.clone().sub(c);
  if (dir.lengthSq() < 1e-6) dir.set(1, 0.8, 1);
  dir.normalize();
  const pos = c.clone().addScaledVector(dir, d);
  camera.near = Math.max(0.001, d / 500);
  camera.far = d * 50;
  camera.updateProjectionMatrix();
  flyTo(pos, c);
}

function applyCamView(v) {
  
  let c = null;
  if (v.lookAt) {
    const m = models.find(x => x.name === v.lookAt && x.ok);
    if (m) {
      const b = new THREE.Box3().setFromObject(m.obj);
      if (!b.isEmpty()) c = b.getCenter(new THREE.Vector3());
    }
  }
  if (!c) c = new THREE.Vector3().fromArray(v.fallback || v.target || [0, 0.5, 0]);

  const dir = new THREE.Vector3().fromArray(v.dir);
  if (dir.lengthSq() < 1e-6) dir.set(1, 0.22, 0.1);
  dir.normalize();
  const d = v.dist;
  const pos = c.clone().addScaledVector(dir, d);
  camera.near = Math.max(0.001, d / 500);
  camera.far = d * 50;
  camera.updateProjectionMatrix();
  flyTo(pos, c);
}


const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;

renderer.domElement.addEventListener('pointerdown', e => {
  stopFly();                                       
  downAt = { x:e.clientX, y:e.clientY };
});
renderer.domElement.addEventListener('wheel', stopFly, { passive:true });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 5) return;                          
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(root.children, true);
  if (!hits.length) return select(null);             
  const o = hits[0].object;
  const rec = models.find(m => m.obj && (o === m.obj || m.obj.getObjectById(o.id)));
  if (rec) {
    select(rec);                                     
    const url = LINK_URLS[rec.name];
    if (url) openCvPop(url);                         
  }
});


const setWire = (v) => {
  wireframe = v;
  root.traverse(o => { if (o.isMesh) {
    const m = Array.isArray(o.material) ? o.material : [o.material];
    m.forEach(x => x && (x.wireframe = v));
  }});
  document.getElementById('wire').textContent = v ? 'Wireframe ●' : 'Wireframe';
};
document.getElementById('frame').onclick = () => { select(null); frame(); };
document.getElementById('wire').onclick = () => setWire(!wireframe);
document.getElementById('on').onclick = () => models.forEach(m => {
  if (m.ok) m.obj.visible = true; m.row.querySelector('input').checked = true; });
document.getElementById('off').onclick = () => models.forEach(m => {
  if (m.ok) m.obj.visible = false; m.row.querySelector('input').checked = false; });
document.getElementById('add').onchange = (e) => {
  for (const f of e.target.files) {
    const rec = addEntry(f.name.replace(/\.(glb|gltf)$/i, ''), URL.createObjectURL(f));
    loader.load(rec.src, g => onLoad(rec, g), undefined, () => onErr(rec));
  }
};

addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { select(null); frame(); }
  if (e.key === 'w' || e.key === 'W') setWire(!wireframe);
  if (e.key === 'Escape') { closeCvPop(); select(null); }   
  if (e.key === 'c' || e.key === 'C')                      
    console.log('CAM ' + JSON.stringify({
      target: controls.target.toArray().map(n => +n.toFixed(3)),
      pos: camera.position.toArray().map(n => +n.toFixed(3))
    }));
});


function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
addEventListener('resize', resize);
resize();

let frames = 0, last = performance.now(), fps = 0;
renderer.setAnimationLoop(() => {
  if (camAnim) {                                   
    const k = Math.min(1, (performance.now() - camAnim.t0) / camAnim.dur);
    const e = easeInOut(k);
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
    controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);
    if (k >= 1) camAnim = null;
  }
  const st = performance.now() / 1000;             
  uLeafTime.value = st;                            
  for (const m of models) {
    if (!m.sway || !m.obj) continue;
    m.obj.position.x = m.sway.bx + m.sway.amp * Math.sin(st * SWAY.speed * m.sway.rate + m.sway.phase);
  }
  controls.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - last > 500) {
    fps = Math.round(frames * 1000 / (now - last));
    frames = 0; last = now;
    let tris = 0, draw = 0;
    root.traverse(o => { if (o.isMesh && o.visible) {
      const g = o.geometry;
      tris += Math.floor((g.index ? g.index.count : g.attributes.position.count) / 3); draw++;
    }});
    const inf = renderer.info;
    hudEl.innerHTML =
      `โมเดล ${models.filter(m=>m.ok&&m.obj.visible).length}/${models.length}  ·  mesh ${draw}  ·  สามเหลี่ยม ${tris.toLocaleString()}\n` +
      `draw call ${inf.render.calls}  ·  ${fps} fps` +
      (selected ? `\nเลือก: <span id="sel">${selected.name}</span>` : '');
  }
});

loadAll();
</script>
